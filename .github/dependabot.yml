# Weekly update pull requests for Discipline OS. Each one runs the full checks; merge it when
# they're green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /discipline-os
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
