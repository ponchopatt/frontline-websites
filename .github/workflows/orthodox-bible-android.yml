# Orthodox Bible: build the Android app from the web app with Capacitor.
#   Run it from the Actions tab ("Run workflow"). It makes an .apk to install and test on a phone
#   and, when the signing secrets are set, an .aab to upload to Google Play.
name: Orthodox Bible Android

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/orthodox-bible

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - name: Point the app at the live site
        env:
          SITE: ${{ vars.ORTHODOX_BIBLE_SITE }}
        run: test -z "$SITE" || sed -i "s|window.OB_SITE = \"\";|window.OB_SITE = \"$SITE\";|" public/config.js
      - run: npx cap add android && npx cap sync android
      - name: Test build (.apk)
        working-directory: apps/orthodox-bible/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orthodox-bible-apk
          path: apps/orthodox-bible/android/app/build/outputs/apk/debug/*.apk
      - name: Store build (.aab), signed
        if: env.SIGNED == 'true'
        working-directory: apps/orthodox-bible/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > upload.jks
          ./gradlew bundleRelease
          jarsigner -keystore upload.jks -storepass "$KEY_PASSWORD" app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
      - uses: actions/upload-artifact@v4
        if: env.SIGNED == 'true'
        with:
          name: orthodox-bible-aab
          path: apps/orthodox-bible/android/app/build/outputs/bundle/release/*.aab
