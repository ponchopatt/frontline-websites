<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Imperium Detailing</title>
<style>
:root{--bg:#F3F5F8;--card:#fff;--text:#121721;--muted:#5C6675;--good:#1E9E5A}
@media (prefers-color-scheme: dark){:root{--bg:#0B0E12;--card:#141920;--text:#E8ECF1;--muted:#8B95A5;--good:#34C776}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
main{background:var(--card);border-radius:16px;padding:28px 24px;max-width:420px;width:100%;text-align:center}
h1{font-size:22px;margin:0 0 8px}
p{margin:0;color:var(--muted)}
.tick{font-size:40px;color:var(--good);line-height:1}
b{letter-spacing:.3em;font-size:12px;display:block;margin-bottom:18px}
</style>
<main>
  <b>IMPERIUM DETAILING</b>
  <div id="paid" hidden><div class="tick">✓</div><h1>Deposit paid</h1><p>Thanks, your spot is locked in. The $50 comes off the final price. See you then.</p></div>
  <div id="not" hidden><h1>No payment made</h1><p>Nothing was charged. You can use the same link again any time today.</p></div>
</main>
<script>document.getElementById(/[?&]paid=1/.test(location.search)?"paid":"not").hidden=false;</script>
